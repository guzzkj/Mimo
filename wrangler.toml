# Cloudflare Pages: build estático em ./dist + Pages Functions em ./functions.
# Segredos (DATABASE_URL, RESEND_API_KEY, CRON_SECRET) NUNCA ficam aqui:
#   local  -> .dev.vars (ignorado pelo git; veja .dev.vars.example)
#   remoto -> `wrangler pages secret put <NOME>` ou painel do Cloudflare.
name = "mimo"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Valores de desenvolvimento (wrangler pages dev).
[vars]
APP_ENV = "development"
APP_URL = "http://localhost:5173"
EMAIL_FROM = "Mimo <onboarding@resend.dev>"

[env.preview.vars]
APP_ENV = "preview"
APP_URL = "https://preview.mimo-421.pages.dev"
EMAIL_FROM = "Miau.Cash <onboarding@resend.dev>"

# TODO: trocar APP_URL/EMAIL_FROM para miau.cash quando o domínio for comprado e verificado no Resend.
[env.production.vars]
APP_ENV = "production"
APP_URL = "https://mimo-421.pages.dev"
EMAIL_FROM = "Miau.Cash <onboarding@resend.dev>"
